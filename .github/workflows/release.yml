name: Release npm package

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: false
      - run: npm install --global npm@^12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx --yes semantic-release@25.0.8 --branches main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
