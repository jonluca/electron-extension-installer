name: Release npm package

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      # setup-node@v7 no longer supplies the non-secret placeholder Yarn 1
      # expects for the token reference in its generated npm configuration.
      # npm publishing still authenticates through GitHub OIDC.
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^12.0.2 yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: npx --yes semantic-release@25.0.8 --branches main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
